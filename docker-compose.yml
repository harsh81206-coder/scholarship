services:
  api:
    build: ./api
    container_name: vps-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/vps.db
      JWT_SECRET: local-demo-secret-change-before-deployment
      ADAPTER_MODE: mock
      DEMO_OTP: "123456"
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - vps-db:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_USE_MOCK: "true"
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: vps-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_USE_MOCK: "true"
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  vps-db:
